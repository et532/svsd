name: Peepl
options:
  bundleIdPrefix: com.vincelin
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Peepl:
    type: application
    platform: iOS
    sources: [Peepl]
    info:
      path: Peepl/Info.plist
      properties:
        PeeplAPIBase: $(PEEPL_API_BASE)
        PeeplDebugToken: $(PEEPL_DEBUG_TOKEN)
        UILaunchScreen: {UIColorName: LaunchBackground}
        UIAppFonts: [Geist-Light.ttf, Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, GeistMono-Regular.ttf, GeistMono-Medium.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincelin.peepl
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Peepl
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Peepl listens when you tap the mic so you can talk instead of type."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Peepl turns what you say into a note, on your iPhone when it can."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        PEEPL_API_BASE: https://peepl-steel.vercel.app
        PEEPL_DEBUG_TOKEN: ""
    configs:
      Release:
        # App Attest needs a paid developer account; Debug builds (free Apple ID) go without it
        CODE_SIGN_ENTITLEMENTS: Peepl/Peepl.entitlements
  PeeplTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PeeplTests]
    dependencies:
      - target: Peepl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincelin.peepl.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Peepl.app/Peepl
        BUNDLE_LOADER: $(TEST_HOST)
  PeeplUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PeeplUITests]
    dependencies:
      - target: Peepl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincelin.peepl.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Peepl
schemes:
  Peepl:
    build:
      targets:
        Peepl: all
    test:
      targets: [PeeplTests]
  PeeplUI: # UI tests drive the Simulator (slow); run on purpose: -scheme PeeplUI
    build:
      targets:
        Peepl: all
    test:
      targets: [PeeplUITests]
